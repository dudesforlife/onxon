<!doctype html> <!-- Gunakan standard HTML5. -->
<html lang="en"> <!-- Tetapkan bahasa utama halaman kepada English. -->
<head> <!-- Mula bahagian metadata dan gaya halaman. -->
<meta charset="utf-8"> <!-- Benarkan aksara khas dan emoji dipaparkan dengan betul. -->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"> <!-- Pastikan ilustrasi responsif pada telefon. -->
<meta name="theme-color" content="#0b1218"> <!-- Warnakan bar pelayar supaya sepadan dengan bilik snooker. -->
<title>ONXON - The Perfect Shot</title> <!-- Tajuk yang dipaparkan pada tab pelayar. -->
<style> /* Mula semua gaya dalaman supaya fail kekal satu HTML. */
:root{--night:#0b1218;--wall:#14242a;--wall2:#0f1d22;--cream:#f4e7c7;--gold:#d7a94b;--wood:#6f3c22;--wood2:#3c2117;--cloth:#087b55;--cloth-dark:#05573e;--ink:#eef7f4} /* Simpan palet warna utama ilustrasi. */
*{box-sizing:border-box} /* Pastikan padding tidak menambah saiz elemen. */
html,body{margin:0;min-height:100%;background:var(--night)} /* Buang margin dan penuhkan latar halaman. */
body{min-height:100vh;display:grid;place-items:center;padding:clamp(12px,3vw,34px);overflow-x:hidden;color:var(--ink);font-family:"Segoe UI",Arial,sans-serif;background:radial-gradient(circle at 50% 8%,#27404a 0,#14242a 28%,#0b1218 74%)} /* Pusatkan poster dalam bilik snooker gelap. */
.poster{width:min(1180px,100%);border:1px solid #ffffff1f;border-radius:clamp(18px,3vw,34px);overflow:hidden;position:relative;background:#111f24;box-shadow:0 38px 90px #000b,0 0 0 8px #ffffff08} /* Bina bingkai poster utama. */
.poster::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(115deg,#ffffff0d,transparent 25%,transparent 70%,#d7a94b0d)} /* Tambah pantulan cahaya halus di atas poster. */
.scene{display:block;width:100%;height:auto;aspect-ratio:12/7.6;background:#102027} /* Jadikan SVG mengikut lebar skrin. */
.caption{position:absolute;left:clamp(16px,4vw,50px);top:clamp(16px,4vw,42px);z-index:3;pointer-events:none} /* Letakkan tajuk di penjuru kiri atas. */
.kicker{margin:0 0 5px;font-size:clamp(9px,1.2vw,13px);font-weight:800;letter-spacing:.28em;color:#d7a94b} /* Gaya label kecil emas. */
h1{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:clamp(30px,6vw,72px);font-weight:500;line-height:.92;letter-spacing:-.045em;color:#f4e7c7;text-shadow:0 5px 28px #000} /* Gaya tajuk besar klasik. */
.caption span{display:block;margin-top:9px;font-size:clamp(10px,1.4vw,15px);letter-spacing:.16em;color:#b9cbc9} /* Gaya slogan di bawah tajuk. */
.shot-note{position:absolute;right:clamp(14px,3vw,34px);bottom:clamp(12px,2.6vw,30px);z-index:3;display:flex;align-items:center;gap:9px;padding:8px 13px;border:1px solid #ffffff1f;border-radius:999px;background:#081014aa;color:#dbe9e5;font-size:clamp(9px,1.1vw,12px);font-weight:700;letter-spacing:.08em;backdrop-filter:blur(5px)} /* Paparkan nota animasi di bawah kanan. */
.shot-note i{width:7px;height:7px;border-radius:50%;background:#e4b84f;box-shadow:0 0 12px #e4b84f;animation:signal 6s ease-in-out infinite} /* Jadikan lampu status berkelip semasa pukulan. */
.lamp-glow{animation:lampPulse 6s ease-in-out infinite} /* Hidupkan denyutan cahaya lampu. */
.cue-rig{transform-box:fill-box;transform-origin:58% 50%;animation:cueShot 6s ease-in-out infinite} /* Gerakkan kayu snooker ke belakang dan ke depan. */
.shooting-arm{transform-box:fill-box;transform-origin:15% 55%;animation:armShot 6s ease-in-out infinite} /* Gerakkan lengan pemain bersama kayu. */
.cue-ball{transform-box:fill-box;transform-origin:center;animation:cueBallRoll 6s cubic-bezier(.25,.72,.25,1) infinite} /* Gerakkan bola putih selepas dipukul. */
.target-ball{transform-box:fill-box;transform-origin:center;animation:targetBallRoll 6s cubic-bezier(.2,.72,.23,1) infinite} /* Gerakkan bola merah ke lubang selepas pelanggaran. */
.target-shadow{transform-box:fill-box;transform-origin:center;animation:targetShadow 6s cubic-bezier(.2,.72,.23,1) infinite} /* Gerakkan bayang bola merah bersama bola. */
.cue-shadow{transform-box:fill-box;transform-origin:center;animation:cueShadow 6s cubic-bezier(.25,.72,.25,1) infinite} /* Gerakkan bayang bola putih bersama bola. */
.observer-head{transform-box:fill-box;transform-origin:50% 90%;animation:watchShot 6s ease-in-out infinite} /* Condongkan kepala pemerhati ketika bola bergerak. */
.observer-hand{transform-box:fill-box;transform-origin:25% 10%;animation:handReact 6s ease-in-out infinite} /* Gerakkan tangan pemerhati sebagai reaksi kecil. */
.pocket-flash{animation:pocketFlash 6s ease-out infinite} /* Beri kilauan ketika bola masuk lubang. */
.speech-bubble{animation:speechAppear 6s ease-in-out infinite;transform-box:fill-box;transform-origin:88% 100%} /* Paparkan gelembung dialog selepas bola merah masuk lubang. */
@keyframes cueShot{0%,10%,100%{transform:translate(0,0)}18%{transform:translate(-25px,8px)}24%{transform:translate(19px,-6px)}29%,92%{transform:translate(0,0)}} /* Urutan kayu ditarik dan ditolak. */
@keyframes armShot{0%,10%,100%{transform:rotate(0deg)}18%{transform:rotate(4deg)}24%{transform:rotate(-3deg)}29%,92%{transform:rotate(0deg)}} /* Urutan lengan memukul bola. */
@keyframes cueBallRoll{0%,24%{transform:translate(0,0) rotate(0)}45%,100%{transform:translate(190px,-52px) rotate(540deg)}} /* Bola putih bergerak hingga bertemu bola merah. */
@keyframes cueShadow{0%,24%{transform:translate(0,0);opacity:.34}45%,100%{transform:translate(190px,-52px);opacity:.25}} /* Bayang bola putih mengikut gerakan. */
@keyframes targetBallRoll{0%,44%{transform:translate(0,0) scale(1);opacity:1}72%{transform:translate(165px,-78px) scale(1);opacity:1}78%,100%{transform:translate(171px,-83px) scale(.45);opacity:0}} /* Bola merah bergerak dan jatuh ke lubang. */
@keyframes targetShadow{0%,44%{transform:translate(0,0) scale(1);opacity:.34}72%{transform:translate(165px,-78px) scale(1);opacity:.25}78%,100%{transform:translate(171px,-83px) scale(.45);opacity:0}} /* Bayang bola merah hilang di lubang. */
@keyframes watchShot{0%,40%,100%{transform:rotate(0deg)}56%,78%{transform:rotate(-5deg)}} /* Kepala pemerhati mengekori bola. */
@keyframes handReact{0%,52%,100%{transform:rotate(0deg)}65%,82%{transform:rotate(-12deg)}} /* Tangan pemerhati memberi reaksi. */
@keyframes pocketFlash{0%,68%,100%{opacity:0;transform:scale(.4)}73%{opacity:.9;transform:scale(1.5)}79%{opacity:0;transform:scale(2.2)}} /* Kilauan pendek saat bola masuk. */
@keyframes speechAppear{0%,72%{opacity:0;transform:translateY(12px) scale(.72)}78%,92%{opacity:1;transform:translateY(0) scale(1)}98%,100%{opacity:0;transform:translateY(-5px) scale(.94)}} /* Dialog muncul selepas bola masuk, kekal seketika dan hilang sebelum pukulan berulang. */
@keyframes lampPulse{0%,100%{opacity:.72}25%{opacity:.88}72%{opacity:1}} /* Cahaya lampu bernafas perlahan. */
@keyframes signal{0%,20%,90%,100%{opacity:.35}24%,78%{opacity:1}} /* Titik nota menyala sepanjang aksi. */
@media(max-width:620px){body{padding:8px}.poster{border-radius:18px}.caption{top:14px;left:16px}.shot-note{right:10px;bottom:9px;padding:6px 9px}.scene{aspect-ratio:12/8.6}} /* Sesuaikan ruang dan bentuk poster untuk telefon. */
@media(prefers-reduced-motion:reduce){.lamp-glow,.cue-rig,.shooting-arm,.cue-ball,.target-ball,.target-shadow,.cue-shadow,.observer-head,.observer-hand,.pocket-flash,.shot-note i{animation:none!important}.speech-bubble{animation:none!important;opacity:1!important;transform:none!important}} /* Matikan gerakan tetapi kekalkan dialog kelihatan jika pengguna memilih gerakan minimum. */
</style> <!-- Tamat semua gaya dalaman. -->
</head> <!-- Tamat bahagian kepala halaman. -->
<body> <!-- Mula kandungan visual halaman. -->

    </defs> <!-- Tamat semua definisi SVG. -->
